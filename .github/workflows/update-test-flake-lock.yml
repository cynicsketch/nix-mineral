name: "Flake.lock: update Nix dependencies (NixOS stub flake for CI)"

on:
  schedule:
    - cron: '0 0 * * 0' # runs weekly on Sunday at 00:00
  workflow_dispatch: # allows manual triggering

jobs:
  nixos-stub-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          path-to-flake-dir: 'tests/nixos-stub/' # path to nixos-stub flake
          pr-title: "Update Nix flake inputs (NixOS stub)"
          pr-labels: |
            dependencies
            automated
